name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One install at the repository root serves both jobs: the app at the root and the SAP test project
# in sap-tests/ share package.json and bun.lock. The Playwright-SAP fork (Playwright 1.53, installed
# as playwright-sap-recorder) cannot install browsers on newer Ubuntu releases. It records WebGUI
# only, so CI installs no browser for it.
jobs:
  sap-tests:
    name: sap-tests (types, spec discovery, plugin, Mock PLC, IDoc and API tests on mocks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node runs Playwright (the CLI's shebang); Bun only installs and runs scripts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The hook that keeps Claude Code's shell commands away from .env files, and the step of
      # `bun run setup` that brings an older checkout to the current layout.
      - run: bun test ./.claude/hooks/guard-dotenv.test.ts ./scripts/upgrade-layout.test.ts
      - run: bunx tsc -p sap-tests --noEmit
      # Linting and formatting of sap-tests run in the app job, which lints the whole repository.
      # Loads every spec without running it: catches syntax and import errors in recorded flows. The SAP flows themselves need a test system (not in CI).
      - run: bun run test:sap:list
      # The OData tests against the local mock of their services (odata/mock). No browser needed;
      # `bun install` above has generated the clients.
      - run: bun run test:api:mock
      # The Mock PLC (mfs/): telegrams, the protocol and the emulator against the fake EWM, over
      # local TCP ports. No browser and no SAP system.
      - run: bun run test:mfs
      # IDocs (idoc/): the model, the mock receiver (started by the test run, local ports only) and
      # the idocInbox fixture. No browser and no SAP system.
      - run: bun run test:idoc
      # The SAP plugin itself (sap-plugin/): selector engines, page methods, UI5 wait and model
      # reads. Most of these tests open SAP's public UI5 demo kit (ui5.sap.com), so they need
      # internet access; the config retries a failed test once in CI.
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run test:plugin

      - name: Upload plugin test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sap-plugin-report
          path: |
            sap-tests/playwright-report/
            sap-tests/test-results/
          retention-days: 7

  app:
    name: app (check, lint of everything, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node runs Playwright (in sap-tests and the app's own) and Vitest.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # One install for the app and sap-tests: the e2e suite starts a real run of the offline _demo
      # tests through the app.
      - name: Install
        run: |
          bun install --frozen-lockfile
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Type check
        run: bun run check
      # One step per tool, like `bun run lint`, but every tool runs and each failure is its own
      # log group. Runs after the type check: oxlint --type-aware needs .svelte-kit/types. It lints
      # the app and sap-tests (sap-tests/.oxlintrc.json for the files there).
      - name: Lint
        run: |
          fail=0
          echo "::group::oxlint (type-aware)"; bunx oxlint --type-aware --deny-warnings || fail=1; echo "::endgroup::"
          echo "::group::oxfmt (check)";       bunx oxfmt --check                       || fail=1; echo "::endgroup::"
          echo "::group::prettier (svelte)";   bunx prettier --check "**/*.svelte"      || fail=1; echo "::endgroup::"
          echo "::group::knip";                bunx knip                                || fail=1; echo "::endgroup::"
          echo "::group::eslint";              bunx eslint .                            || fail=1; echo "::endgroup::"
          exit $fail
      - name: Unit and component tests
        run: bun run test
      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
