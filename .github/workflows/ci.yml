name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned to 24.04: the Playwright-SAP fork is based on Playwright 1.53, which cannot install
# browsers on newer Ubuntu releases (ubuntu-latest is 26.04). Revisit after the fork upgrade (guide §6).
jobs:
  sap-tests:
    name: sap-tests (types, lint, format, spec discovery)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sap-tests
    steps:
      - uses: actions/checkout@v7
      # Node runs Playwright (the CLI's shebang); Bun only installs and runs scripts.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      # Loads every spec with the Playwright-SAP fork without running it: catches syntax and
      # import errors in recorded flows. The SAP flows themselves need a test system (not in CI).
      - run: bunx playwright test --list

  app:
    name: app (check, lint, unit, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Node runs Playwright (both the fork in sap-tests and the app's own) and Vitest.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The e2e suite starts a real run of the offline _demo tests through the app,
      # so the fork and its browser are needed here too.
      - name: Install sap-tests
        working-directory: sap-tests
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Install app
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Type check
        working-directory: app
        run: bun run check
      # One step per tool, like `bun run lint`, but every tool runs and each failure is its own
      # log group. Runs after the type check: oxlint --type-aware needs .svelte-kit/types.
      - name: Lint
        working-directory: app
        run: |
          fail=0
          echo "::group::oxlint (type-aware)"; bunx oxlint --type-aware --deny-warnings || fail=1; echo "::endgroup::"
          echo "::group::oxfmt (check)";       bunx oxfmt --check                       || fail=1; echo "::endgroup::"
          echo "::group::prettier (svelte)";   bunx prettier --check "**/*.svelte"      || fail=1; echo "::endgroup::"
          echo "::group::knip";                bunx knip                                || fail=1; echo "::endgroup::"
          echo "::group::eslint";              bunx eslint .                            || fail=1; echo "::endgroup::"
          exit $fail
      - name: Unit and component tests
        working-directory: app
        run: bun run test
      - name: End-to-end tests
        working-directory: app
        run: bun run test:e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
