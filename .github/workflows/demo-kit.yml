name: Demo kit flows

# The flows in sap-tests/tests/fiori/demokit run against SAP's public UI5 demo apps (ui5.sap.com).
# They are the only complete Fiori flows that run without a test system. They are not part of CI on
# every push: a change on SAP's side or a slow network would fail unrelated pull requests. A nightly
# run shows such a change the next morning instead.
on:
  schedule:
    # 04:17 UTC, Monday to Friday. Off the full hour, when GitHub's scheduler is busiest.
    - cron: '17 4 * * 1-5'
  workflow_dispatch:

concurrency:
  group: demo-kit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  demo-kit:
    name: sap-tests (Fiori flows on the UI5 demo kit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One install at the repository root, shared with the app; the script runs the tests in sap-tests/.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node runs Playwright (the CLI's shebang); Bun only installs and runs scripts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run test:demokit

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-kit-report
          path: |
            sap-tests/playwright-report/
            sap-tests/test-results/
          retention-days: 7
